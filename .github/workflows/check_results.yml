name: Check Results Calcio

on:
  schedule:
    # Gira il lunedì mattina alle 06:00 UTC (08:00 italiane)
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore bets and CSV from scanner cache
        uses: actions/cache@v4
        id: cache-restore
        with:
          path: |
            bets.json
            bets_log.csv
          key: market-hunter-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-hunter-${{ runner.os }}-

      - name: Run results checker
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python results_checker.py

      - name: Save updated bets and CSV to cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            bets.json
            bets_log.csv
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bets-log-aggiornato
          path: bets_log.csv
