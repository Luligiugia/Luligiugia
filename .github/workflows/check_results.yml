name: Check Results Calcio

on:
  schedule:
    # Gira il lunedì mattina alle 06:00 UTC (08:00 italiane)
    - cron: '0 6 * * 1'
  workflow_dispatch:

# QUI DEVI CAMBIARE IL GIORNO PER OGNI REPOSITORY (Venerdì, Sabato, Domenica)
env:
  GIORNO_REPO: "Domenica" 

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore bets and CSV from scanner cache
        uses: actions/cache@v4
        id: cache-restore
        with:
          path: |
            bets.json
            bets_log.csv
          key: market-hunter-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-hunter-${{ runner.os }}-

      - name: Run results checker
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python results_checker.py

      - name: Save updated bets and CSV to cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            bets.json
            bets_log.csv
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      # STEP AGGIUNTI PER GENERARE IL NOME CON DATA E GIORNO
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Rename CSV for download
        if: always()
        run: cp bets_log.csv "bets_log_${{ env.GIORNO_REPO }}_${{ steps.date.outputs.date }}.csv" || true

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bets-log-${{ env.GIORNO_REPO }}-${{ steps.date.outputs.date }}
          path: bets_log_${{ env.GIORNO_REPO }}_${{ steps.date.outputs.date }}.csv
