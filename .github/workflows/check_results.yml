name: Check Results Calcio

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  GIORNO_REPO: "Domenica" # ⚠️ CAMBIA IN Sabato E Domenica NEGLI ALTRI REPOSITORY

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run results checker
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python results_checker.py
        
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update results [skip ci]"
          git push
          
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        
      - name: Rename CSV for download
        if: always()
        run: cp bets_log.csv "bets_log_${{ env.GIORNO_REPO }}_${{ steps.date.outputs.date }}.csv" || true
        
      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bets-log-${{ env.GIORNO_REPO }}-${{ steps.date.outputs.date }}
          path: bets_log_${{ env.GIORNO_REPO }}_${{ steps.date.outputs.date }}.csv
