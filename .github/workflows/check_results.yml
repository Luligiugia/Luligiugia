name: Check Results Calcio

on:
  schedule:
    - cron: '0 6 * * 1' # Lunedì mattina alle 06:00 UTC
  workflow_dispatch:

env:
  GIORNO_REPO: "Venerdì" # ⚠️ RICORDA DI CAMBIARE IN "Sabato" O "Domenica" NEGLI ALTRI REPOSITORY

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run results checker
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python results_checker.py

      # Salva il CSV aggiornato nel repository
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bets_log.csv || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update results [skip ci]"
          git push

      # Genera la data di oggi in formato YYYY-MM-DD
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Crea una copia del file con il nome specifico (es: bets_log_Venerdì_2026-10-26.csv)
      - name: Rename CSV for download
        if: always()
        run: cp bets_log.csv "bets_log_${{ env.GIORNO_REPO }}_${{ steps.date.outputs.date }}.csv" || true

      # Carica l'artefatto scaricabile
      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bets-log-${{ env.GIORNO_REPO }}-${{ steps.date.outputs.date }}
          path: bets_log_${{ env.GIORNO_REPO }}_${{ steps.date.outputs.date }}.csv
