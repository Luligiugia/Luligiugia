name: Market Hunter Calcio

on:
  repository_dispatch:
    types: [scan]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permesso fondamentale per salvare i file nel repo
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests
        
      # Ripristina solo lo stato (necessario per non ri-scansionare da zero ad ogni run)
      - name: Restore state cache
        uses: actions/cache@v4
        id: cache
        with:
          path: state.json
          key: market-hunter-state-${{ runner.os }}
          restore-keys: |
            market-hunter-state-${{ runner.os }}-
            
      - name: Run scanner
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_hunter_calcio.py
        
      - name: Save state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: market-hunter-state-${{ runner.os }}-${{ github.run_id }}
          
      # SALVA I FILE DIRETTAMENTE NEL REPOSITORY (Così il check_results li trova)
      - name: Commit bets files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bets.json bets_log.csv || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update bets [skip ci]"
          git push
          
      - name: Upload CSV artifact (opzionale, per sicurezza)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bets-log-backup
          path: bets_log.csv
