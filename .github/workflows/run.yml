name: Market Hunter Calcio

on:
  schedule:
    - cron: '0 21 * * 0'   # domenica alle 21:00 UTC – esegue SOLO il job check_results
  repository_dispatch:
    types: [scan]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Restore state cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            state.json
            bets.json
          key: market-hunter-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-hunter-${{ runner.os }}-
      - name: Run scanner
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_hunter_calcio.py
      - name: Save updated state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state.json
            bets.json
          key: ${{ steps.cache.outputs.cache-primary-key }}

  check_results:
    runs-on: ubuntu-latest
    needs: scan
    if: github.event.schedule == '0 21 * * 0'   # scatta solo per il trigger schedule domenicale
    steps:
      - uses: actions/checkout@v4
      - name: Restore bets.json from scan job cache
        uses: actions/cache@v4
        with:
          path: bets.json
          key: market-hunter-${{ runner.os }}-${{ github.run_id }}
          restore-keys: market-hunter-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run results checker
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python results_checker.py
